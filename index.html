<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f5f7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16171b">
<title>Discord Timestamps</title>
<meta name="description" content="Generate Discord timestamp codes that show every reader the time in their own timezone.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏰</text></svg>">
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<main class="app" id="app" data-loading>
  <h1 class="brand">Discord timestamps</h1>

  <div class="picker">
    <div class="field">
      <label for="date">Date</label>
      <input id="date" type="date" required>
    </div>
    <div class="field">
      <label for="time">Time</label>
      <input id="time" type="time" required>
    </div>
    <div class="field">
      <label for="tz">Timezone</label>
      <select id="tz"></select>
    </div>
    <button class="btn-now" id="now" type="button">Now</button>
  </div>

  <p class="status" id="status" role="status" hidden></p>

  <ul class="rows" id="rows" aria-label="Timestamp formats">
    <li class="row"><span class="pv sk" data-preview="R"></span><code class="cd sk" data-code="R"></code><button class="copy sk" type="button" data-copy="R" aria-label="Copy relative time code" disabled>Copy</button></li>
    <li class="row"><span class="pv sk" data-preview="t"></span><code class="cd sk" data-code="t"></code><button class="copy sk" type="button" data-copy="t" aria-label="Copy short time code" disabled>Copy</button></li>
    <li class="row"><span class="pv sk" data-preview="T"></span><code class="cd sk" data-code="T"></code><button class="copy sk" type="button" data-copy="T" aria-label="Copy long time code" disabled>Copy</button></li>
    <li class="row"><span class="pv sk" data-preview="d"></span><code class="cd sk" data-code="d"></code><button class="copy sk" type="button" data-copy="d" aria-label="Copy short date code" disabled>Copy</button></li>
    <li class="row"><span class="pv sk" data-preview="D"></span><code class="cd sk" data-code="D"></code><button class="copy sk" type="button" data-copy="D" aria-label="Copy long date code" disabled>Copy</button></li>
    <li class="row"><span class="pv sk" data-preview="f"></span><code class="cd sk" data-code="f"></code><button class="copy sk" type="button" data-copy="f" aria-label="Copy date and time code" disabled>Copy</button></li>
    <li class="row"><span class="pv sk" data-preview="F"></span><code class="cd sk" data-code="F"></code><button class="copy sk" type="button" data-copy="F" aria-label="Copy weekday, date and time code" disabled>Copy</button></li>
  </ul>

  <noscript><p class="status" data-kind="danger">This page needs JavaScript to build timestamp codes.</p></noscript>
</main>
</body>
</html>
